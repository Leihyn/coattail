<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Coattail">
  <title>Coattail</title>
  <defs><clipPath id="sq"><rect width="512" height="512" rx="104"/></clipPath></defs>

  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="#0c0f0e"/>

    <!-- the trajectory: faint before the follower joined, solid after -->
    <path d="M96 414 L232 292" stroke="#242c29" stroke-width="20" stroke-linecap="round" fill="none"/>
    <path d="M232 292 L378 162" stroke="#2fbf7e" stroke-width="20" stroke-linecap="round" fill="none"/>

    <!-- the follower, riding the same line -->
    <circle cx="218" cy="304" r="47" fill="#0c0f0e"/>
    <circle cx="218" cy="304" r="43" fill="none" stroke="#8b7cf6" stroke-width="19"/>

    <!-- the leader, whose position is readable -->
    <circle cx="384" cy="156" r="66" fill="#0c0f0e"/>
    <circle cx="384" cy="156" r="50" fill="#2fbf7e"/>
  </g>
</svg>
